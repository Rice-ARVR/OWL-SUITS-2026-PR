services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: dev
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - VITE_API_URL=http://localhost:8000
      - UVICORN_HOST=0.0.0.0
    command: sleep infinity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  server:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: server
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      target: frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - server
